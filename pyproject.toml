[project]
name = "youtubechatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prthm45-kanha", email = "agrawalpratham2706@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "youtube-transcript-api==1.2.4",
]

[project.scripts]
youtubechatbot = "youtubechatbot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
